name: afb_mangaan_mobile
description: AFB Santol Android app with the church portal and offline attendance
publish_to: none
version: 1.1.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  local_auth: ^3.0.2
  mobile_scanner: ^6.0.2
  path: ^1.9.0
  sqflite: ^2.4.1
  uuid: ^4.5.1
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
